name: Deploy Family Pages

on:
  push:
    branches: ["main"]
    paths:
      - "pages-client/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "family-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static family client
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
