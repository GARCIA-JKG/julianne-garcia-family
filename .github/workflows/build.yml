name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Check public client JavaScript
        run: node --check pages-client/app.js

      - name: Build application
        run: npm run build

      - name: Validate Compose
        run: docker compose --env-file .env.example config -q

      - name: Build production container
        run: docker build -t julianne-family:test .
