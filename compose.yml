name: julianne-garcia-family

services:
  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - type: bind
        source: ${DB_DATA_LOCATION}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - family-private
    cpus: 0.75
    mem_limit: 1g

  migrate:
    build:
      context: .
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: database
    command: ["node", "scripts/migrate.mjs"]
    networks:
      - family-private
    cpus: 0.5
    mem_limit: 512m

  db-backup:
    image: postgres:17
    restart: "no"
    profiles: ["maintenance"]
    depends_on:
      database:
        condition: service_healthy
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: database
      TZ: ${TZ}
    volumes:
      - type: bind
        source: ${ARCHIVE_BACKUP_ROOT:-/srv/julianne-garcia-family/backups}/database
        target: /backups/database
    command:
      - sh
      - -ec
      - |
        stamp=$(date +%Y%m%d-%H%M%S)
        tmp="/backups/database/.julianne-family-${stamp}.dump.tmp"
        final="/backups/database/julianne-family-${stamp}.dump"
        trap 'rm -f "$tmp"' EXIT
        PGPASSWORD="$POSTGRES_PASSWORD" pg_dump \
          -h "$DATABASE_HOST" \
          -U "$POSTGRES_USER" \
          -d "$POSTGRES_DB" \
          -Fc \
          -f "$tmp"
        pg_restore --list "$tmp" >/dev/null
        mv "$tmp" "$final"
        trap - EXIT
        echo "Verified database backup: $final"
    networks:
      - family-private
    cpus: 0.5
    mem_limit: 512m

  archive-check:
    image: julianne-family-app:latest
    restart: "no"
    profiles: ["maintenance"]
    depends_on:
      database:
        condition: service_healthy
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: database
      MEDIA_UPLOAD_ROOT: /media/uploads
      ARCHIVE_REPORT_PATH: /backups/health/latest.json
      TZ: ${TZ}
    command: ["node", "scripts/archive-check.mjs"]
    volumes:
      - type: bind
        source: ${MEDIA_ROOT}/family-uploads
        target: /media/uploads
        read_only: true
      - type: bind
        source: ${ARCHIVE_BACKUP_ROOT:-/srv/julianne-garcia-family/backups}/health
        target: /backups/health
    networks:
      - family-private
    cpus: 0.5
    mem_limit: 512m
  web:
    image: julianne-family-app:latest
    build:
      context: .
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      TZ: ${TZ}
      SITE_NAME: ${SITE_NAME}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: database
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      MEDIA_UPLOAD_ROOT: /media/uploads
      ARCHIVE_BACKUP_ROOT: /backups
    ports:
      - "${APP_PORT}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - type: bind
        source: ${MEDIA_ROOT}/master-scans
        target: /media/master-scans
        read_only: true
      - type: bind
        source: ${MEDIA_ROOT}/master-videos
        target: /media/master-videos
        read_only: true
      - type: bind
        source: ${MEDIA_ROOT}/family-uploads
        target: /media/uploads
      - type: bind
        source: ${MEDIA_ROOT}/processed
        target: /media/processed
      - type: bind
        source: ${MEDIA_ROOT}/imports
        target: /media/imports
      - type: bind
        source: ${ARCHIVE_BACKUP_ROOT:-/srv/julianne-garcia-family/backups}
        target: /backups
        read_only: true
    networks:
      family-private:
      family-public:
        aliases:
          - julianne-family-web
    cpus: 1.5
    mem_limit: 2g

networks:
  family-private:
    driver: bridge
  family-public:
    external: true
    name: family-public
